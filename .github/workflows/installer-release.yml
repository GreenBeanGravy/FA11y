name: Installer release

# Pushing a tag like "installer-v1.2.3" builds FA11y Launcher.exe and
# Updater.exe and publishes them as a GitHub release. Installed copies of
# Updater.exe pick up newer releases and replace both executables; old
# single-folder installs are moved to the new layout by updater.py once
# a release exists.

on:
  push:
    tags: ["installer-v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: Test
        working-directory: installer
        run: |
          go vet ./...
          go test ./...

      - name: Build
        working-directory: installer
        run: |
          $version = "${{ github.ref_name }}".Substring("installer-v".Length)
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "../dist/Updater.exe" ./cmd/updater
          go build -trimpath -ldflags "-s -w -H windowsgui" -o "../dist/FA11y Launcher.exe" ./cmd/launcher

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "dist/Updater.exe" "dist/FA11y Launcher.exe" `
            --title "FA11y installer ${{ github.ref_name }}" `
            --notes "FA11y Launcher.exe and Updater.exe. Put both in an empty folder and run Updater.exe to install FA11y, or let an existing FA11y install update itself."
