name: Installer release

# Pushing a tag like "installer-v1.2.3" builds FA11y_Launcher.exe and
# Updater.exe and publishes them as a GitHub release. Installed copies of
# Updater.exe pick up newer releases and replace both executables; old
# single-folder installs are moved to the new layout by updater.py once
# a release exists.

on:
  push:
    tags: ["installer-v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: Test
        working-directory: installer
        run: |
          go vet ./...
          go test ./...

      - name: Build
        working-directory: installer
        run: |
          $version = "${{ github.ref_name }}".Substring("installer-v".Length)
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "../dist/Updater.exe" ./cmd/updater
          go build -trimpath -ldflags "-s -w -H windowsgui" -o "../dist/FA11y_Launcher.exe" ./cmd/launcher

      - name: Release notes
        # Install instructions plus every CHANGELOG.txt entry added since the previous installer release.
        run: |
          python tools/release_notes.py --current-tag "${{ github.ref_name }}" --output "$env:RUNNER_TEMP\notes.md"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-Content "$env:RUNNER_TEMP\notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag on a commit that isn't on main is a Beta installer: published as a
          # pre-release. Only installs on a branch other than main update to pre-releases.
          git merge-base --is-ancestor "${{ github.sha }}" origin/main
          if ($LASTEXITCODE -eq 0) {
            gh release create "${{ github.ref_name }}" "dist/Updater.exe" "dist/FA11y_Launcher.exe" `
              --title "FA11y installer ${{ github.ref_name }}" `
              --notes-file "$env:RUNNER_TEMP\notes.md"
          } else {
            gh release create "${{ github.ref_name }}" "dist/Updater.exe" "dist/FA11y_Launcher.exe" --prerelease `
              --title "FA11y installer ${{ github.ref_name }} (Beta)" `
              --notes-file "$env:RUNNER_TEMP\notes.md"
          }
